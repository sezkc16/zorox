# Codemagic CI config for ZoroX (SkyStream fork, Gold & Black v2.9.1)
# Builds an UNSIGNED iOS .ipa — same output as the GitHub Actions workflow.
# You sign it with ESign (free Apple ID, 7-day cert) and install it.
# Free tier: 500 Mac build minutes/month, 1 build at a time.
workflows:
  ios-unsigned:
    name: ZoroX iOS (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS (release, no codesign)
        # NOTE (2026-11-11): `flutter build ios --release --no-codesign` FAILS on
        # Codemagic — Flutter still demands a Development Team / Provisioning
        # Profile for a device build, even with --no-codesign (the Xcode build
        # itself succeeds, 53.4s, then Flutter's team check kills it).
        # Fix: configure only (writes Generated.xcconfig, no build), then build
        # with xcodebuild directly and signing fully disabled. That bypasses
        # Flutter's team check and produces the same unsigned Runner.app.
        script: |
          flutter build ios --release --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          zip -r -y "ZoroX-${VERSION}-unsigned.ipa" Payload
          ls -lh *.ipa
    artifacts:
      - ZoroX-*.ipa
