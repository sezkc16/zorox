# Codemagic CI config for ZoroX (SkyStream fork, Gold & Black v2.9.1)
# Builds an UNSIGNED iOS .ipa — same output as the GitHub Actions workflow.
# You sign it with ESign (free Apple ID, 7-day cert) and install it.
# Free tier: 500 Mac build minutes/month, 1 build at a time.
workflows:
  ios-unsigned:
    name: ZoroX iOS (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS (release, no codesign)
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          zip -r -y "ZoroX-${VERSION}-unsigned.ipa" Payload
          ls -lh *.ipa
    artifacts:
      - ZoroX-*.ipa
