
workflows:
  ios-unsigned:
    name: ZoroX iOS (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate Dart files
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Build iOS unsigned
        script: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          test -d build/ios/iphoneos/Runner.app || { echo "ERROR: Runner.app not found at build/ios/iphoneos/Runner.app"; exit 1; }
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          zip -r -y "ZoroX-${VERSION}-unsigned.ipa" Payload
          ls -lh *.ipa

    artifacts:
      - ZoroX-*.ipa

  android-apk:
    name: ZoroX Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: 3.47.7

    scripts:
      - name: Configure Flutter and Android SDK
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$CM_BUILD_DIR/android/local.properties"
          flutter doctor -v

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Generate Dart files
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
