org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Do NOT let the Flutter Gradle plugin override abiFilters
# (FlutterPlugin.configureAbiWithoutSplits clears the app's list and
# resets it to all three ABIs). With this set, the app's own
# ndk.abiFilters in app/build.gradle.kts is the only filter and the
# APK is arm64-only. Without it the +6 APK shipped all three ABIs
# despite `abiFilters += "arm64-v8a"` in defaultConfig.
disable-abi-filtering=true
# Bypass strict JVM target checks to allow plugins with older Java defaults (e.g. 1.8) 
# to coexist with the app's Java 17 toolchain.
kotlin.jvm.target.validation.mode = IGNORE
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

